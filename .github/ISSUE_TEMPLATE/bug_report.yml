name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out personal data: no real browsing
        history, sidebar exports, tokens or screenshots of private pages.
        Security issues go to a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Magnetite version
      description: From Settings, or the release you installed, or the commit you built.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.3, Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Optional. Start Magnetite from a terminal with MAGNETITE_LOG=1 and paste
        the lines around the problem. They contain command and event names only.
      render: text
