name: Build tools
description: >-
  Rust (rust-toolchain.toml), cmake, Ninja and the libraries CEF links against,
  Node and pnpm for the sidebar UI, and a cache of the CEF download.
  Run it after actions/checkout; use `shell: bash` in the job.

runs:
  using: composite
  steps:
    - name: Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # GitHub's image has cmake and Ninja; asking apt for them again only
        # adds downloads that can fail. Downloads are tried five times.
        tools=()
        command -v cmake >/dev/null || tools+=(cmake)
        command -v ninja >/dev/null || tools+=(ninja-build)
        sudo apt-get update -q -o Acquire::Retries=5
        # Ubuntu 24.04 names (t64); CEF's libcef.so needs these at link time.
        sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 \
          "${tools[@]}" pkg-config patchelf \
          libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
          libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
          libpango-1.0-0 libcairo2 libasound2t64 libglib2.0-0t64 libdbus-1-3 libx11-6 \
          libxcb1 libxext6 libexpat1 libgtk-3-0t64

    - name: macOS packages
      if: runner.os == 'macOS'
      shell: bash
      run: |
        command -v cmake >/dev/null || brew install cmake
        command -v ninja >/dev/null || brew install ninja

    # cl.exe, cmake and Ninja for CEF's C++ wrapper library.
    - name: MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Rust
      shell: bash
      run: rustup toolchain install

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 10

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: crates/ui/web/pnpm-lock.yaml

    - name: CEF version
      id: cef
      shell: bash
      run: |
        echo "CEF_PATH=$RUNNER_TEMP/cef" >>"$GITHUB_ENV"
        version="$(grep -A1 '^name = "cef-dll-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
        echo "version=$version" >>"$GITHUB_OUTPUT"

    # Only the downloaded archive: the build unpacks it again, which also
    # makes cef-dll-sys copy the runtime files next to fresh binaries.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cef/*/*.tar.bz2
        key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
